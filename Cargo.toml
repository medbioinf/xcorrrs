[package]
name = "mzscoring"
version = "1.3.0"
edition = "2021"
description = "Reimplmenmentation of Comet's xcorr algorithm."
repository = "https://github.com/medbioinf/mzscoring"
homepage = "https://github.com/medbioinf/mzscoring"
documentation = "https://docs.rs/mzscoring"
license-file = "LICENSE"
readme = "README.md"

exclude = [
    "/.github",
    "/test_files",
    "/.vscode",
]

[dependencies]
context_error = "0.3.0"
mzannotate = "0.2.0"
mzcore = "0.2.0"
ndarray = "0.16.1"
ordered-float = "5.5.0"
serde = "1.0.219"
thiserror = "2.0.12"


[dev-dependencies]
dihardts_omicstools = "3.1.0"
itertools = "0.14.0"
ndarray-stats = "0.6.0"
plotly = { version = "0.12.1", features = ["plotly_ndarray"]}
polars = { version = "0.49.1", features = ["decompress", "ndarray", "parquet"] }
rayon = "1.10.0"
