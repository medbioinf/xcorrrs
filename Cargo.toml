[package]
name = "mzscoring"
version = "1.3.0"
edition = "2021"
description = "Reimplmenmentation of Comet's xcorr algorithm."
repository = "https://github.com/medbioinf/mzscoring"
homepage = "https://github.com/medbioinf/mzscoring"
documentation = "https://docs.rs/mzscoring"
license-file = "LICENSE"
readme = "README.md"

exclude = [
    "/.github",
    "/test_files",
    "/.vscode",
]

[dependencies]
context_error = "0.3.0"
mzannotate = "0.2.0"
mzcore = "0.2.0"
mzdata = "0.67.0"
mzpeaks = "1.0.9"
ordered-float = "5.5.0"
serde = "1.0.219"
thiserror = "2.0.12"


[dev-dependencies]
itertools = "0.14.0"
mzdata = { version = "0.67.0", features = ["serde"] }
plotly = "0.12.1"
polars = { version = "0.49.1", features = ["decompress", "parquet"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.10.0"
zstd = "0.13.3"
